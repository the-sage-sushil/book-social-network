<div class="card"
 style="width: 20rem;">
 <img height="200" [src]="bookCover" class="card-img-top" alt="...">
 <div class="card-body overflow-auto">
    <h5 class="card-title fs-6 text-nowrap fw-bold mb-2"><i class="fa-solid fa-book">&nbsp; {{book.title}}</i></h5>
    <h5 class="card-subtitle fs-6 text-secondary mb-2"><i class="fa-solid fa-user-check">&nbsp; {{book.authorName}}</i></h5>
    <h6 class="card-subtitle fs-6 text-secondary mb-2"><i class="fa fa-code">&nbsp; {{book.isbn}}</i></h6>
    <h6 class="card-subtitle fs-6 text-secondary"><i class="fa fa-user">&nbsp; {{book.owner?.firstName}}</i></h6>
    <hr>
    <p class="card-text">{{book.synopsis}}</p>
 </div>
 <div class="card-footer d-flex gap-2 justify-content-between align-content-center">
   <div class="d-flex gap-2">
     <app-rating [rating]="book.rate || 0 "></app-rating>
     <span class="fw-bold" *ngIf="book.rate || 0 > 0">
         {{book.rate}}
     </span>
   </div>
   <div class="d-flex gap-2" *ngIf="!manage">
      <i (click)="onShowDetails()" class="fas fa-circle-info text-primary"></i>
      <i (click)="onBorrow()" class="fas fa-list-check text-primary"></i>
      <i (click)="onAddToWaitingList()" class="fas fa-heart text-danger"></i>
   </div>
   <div class="d-flex gap-2">
      <i (click)="onEdit()" class="fas fa-edit text-success"></i>
      <i (click)="onShare()" class="fas fa-share-nodes text-primary"></i>
      <i (click)="onArchived()" class="fas fa-archive text-danger"></i>
   </div>
 </div>
</div>
